name: AgriMark CI Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio

    - name: Run Pytest Test Suite
      env:
        DATABASE_URL: "sqlite:///:memory:"
        SECRET_KEY: "ci-secret-key-testing"
      run: |
        pytest

  build-web:
    name: Next.js Web App Build & Typecheck
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'web/package.json'

    - name: Install dependencies
      run: |
        cd web
        npm ci

    - name: Build Next.js Web App
      env:
        NEXT_PUBLIC_API_BASE_URL: "https://agrimark-api.onrender.com/api/v1"
      run: |
        cd web
        npm run build

  test-flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'
        cache: true

    - name: Run Flutter Pub Get & Analyze
      run: |
        cd mobile
        flutter pub get
        flutter analyze

    - name: Run Flutter Tests
      run: |
        cd mobile
        flutter test
