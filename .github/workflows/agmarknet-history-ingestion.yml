name: AGMARKNET history and daily ingestion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Official data ingestion mode"
        required: true
        default: historical
        type: choice
        options:
          - historical
          - daily
          - both
  schedule:
    # Run after the India morning market-data publishing window.
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: agrimark-agmarknet-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required GitHub Actions secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in DATA_GOV_IN_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            echo "Configure them in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://tsdjtlmrvbspyzgwmccg.supabase.co|https://tsdjtlmrvbspyzgwmccg.supabase.co/)
              echo "Supabase project URL validated."
              ;;
            *)
              echo "::error::SUPABASE_URL must point to the canonical AgriMark Supabase project."
              exit 1
              ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ingestion dependencies
        run: python -m pip install --upgrade pip supabase python-dotenv

      - name: Backfill official historical data
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'historical' || inputs.mode == 'both') }}
        shell: bash
        run: |
          set -euo pipefail
          for page in $(seq 1 250); do
            output="$(python scripts/data/ingest_agmarknet.py --mode historical)"
            echo "$output"
            finished="$(python -c 'import json,sys; print(str(json.loads(sys.stdin.read()).get("finished", False)).lower())' <<< "$output")"
            if [ "$finished" = "true" ]; then
              echo "Historical AGMARKNET backfill reached the end of the official resource."
              exit 0
            fi
          done
          echo "::error::Historical backfill did not reach the official resource total within 250 pages."
          exit 1

      - name: Ingest all pages of the official daily resource
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily' || inputs.mode == 'both')) }}
        shell: bash
        run: |
          set -euo pipefail
          for page in $(seq 1 250); do
            output="$(python scripts/data/ingest_agmarknet.py --mode daily)"
            echo "$output"
            finished="$(python -c 'import json,sys; print(str(json.loads(sys.stdin.read()).get("finished", False)).lower())' <<< "$output")"
            if [ "$finished" = "true" ]; then
              echo "All pages of the current official daily AGMARKNET resource were ingested."
              exit 0
            fi
          done
          echo "::error::Daily ingestion did not reach the official resource total within 250 pages."
          exit 1
