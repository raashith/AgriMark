name: AgriMark canonical checks

on:
  push:
    branches: [main, integration/agri-canonical, 'web-production-*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Compile Python sources
        shell: bash
        run: |
          python -m compileall backend
          if [ -d agents ]; then python -m compileall agents; fi
          if [ -d ml ]; then python -m compileall ml; fi
      - name: Run backend tests when present
        env:
          PYTHONPATH: "."
        shell: bash
        run: |
          if [ -d tests ]; then
            pytest -q tests
          elif [ -d backend/tests ]; then
            pytest -q backend/tests
          else
            echo "No tests directory; skipping pytest"
          fi
