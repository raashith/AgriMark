name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '/opencode') ||
      contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            Work on the triggering issue/comment with a strict production-safety mindset.
            For issue #43, investigate the Supabase leaked password protection warning.
            Verify whether the configured Supabase plan supports leaked password protection.
            Never create a replacement Supabase project or database, never expose secrets,
            and never invent a code workaround for a platform-level feature.
            If a repository-side auth hardening change is justified, implement it on a new
            branch, run relevant tests/build, and open a PR. Otherwise explain the exact
            platform/dashboard action required and leave the repository unchanged.
