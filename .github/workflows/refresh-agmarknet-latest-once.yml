name: One-time AGMARKNET latest data refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-agmarknet-latest-once.yml
      - scripts/data/ingest_agmarknet.py

permissions:
  contents: read

jobs:
  refresh-latest-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ingestion credentials
        shell: bash
        run: |
          test -n "$DATA_GOV_IN_API_KEY" || { echo "::error::DATA_GOV_IN_API_KEY GitHub Actions secret is missing."; exit 1; }
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL GitHub Actions secret is missing."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY GitHub Actions secret is missing."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: python -m pip install --upgrade pip supabase python-dotenv

      - name: Ingest every page of the official daily AGMARKNET resource
        shell: bash
        run: |
          set -euo pipefail
          for page in $(seq 1 40); do
            echo "Starting official AGMARKNET daily page $page"
            result="$(python scripts/data/ingest_agmarknet.py --mode daily)"
            echo "$result"
            finished="$(python -c 'import json,sys; print(str(json.loads(sys.stdin.read()).get("finished", False)).lower())' <<< "$result")"
            if [ "$finished" = "true" ]; then
              echo "All pages for the current daily resource have been ingested."
              exit 0
            fi
          done
          echo "::error::Stopped after 40 pages without reaching the official resource total."
          exit 1
